<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShadowChat - Register</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#0f172a;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

}

.register-box{

    width:430px;

    background:white;

    padding:40px;

    border-radius:15px;

    box-shadow:0 10px 30px rgba(0,0,0,.35);

}

h1{

    text-align:center;

    color:#2563eb;

    margin-bottom:30px;

}

input{

    width:100%;

    padding:15px;

    margin-top:15px;

    border:1px solid #ddd;

    border-radius:8px;

    font-size:16px;

}

.password-box{

    position:relative;

}

.password-box input{

    padding-right:55px;

}

.password-box span{

    position:absolute;

    right:18px;

    top:31px;

    cursor:pointer;

    color:#2563eb;

    font-size:18px;

}

button{

    width:100%;

    margin-top:25px;

    padding:15px;

    background:#2563eb;

    color:white;

    border:none;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#1d4ed8;

}

.error{

    color:red;

    text-align:center;

    margin-top:15px;

    font-weight:bold;

}

.success{

    color:green;

    text-align:center;

    margin-top:15px;

    font-weight:bold;

}

p{

    text-align:center;

    margin-top:20px;

}

a{

    color:#2563eb;

    text-decoration:none;

    font-weight:bold;

}

a:hover{

    text-decoration:underline;

}

</style>

</head>

<body>

<div class="register-box">

<h1>

<i class="fa-solid fa-user-plus"></i>

Create Account

</h1>

<form method="POST">

<input
type="text"
name="username"
placeholder="Choose Username"
required>

<div class="password-box">

<input
type="password"
name="password"
id="password"
placeholder="Choose Password"
required>

<span onclick="togglePassword()">

<i id="eye" class="fa-solid fa-eye"></i>

</span>

</div>

<button type="submit">

<i class="fa-solid fa-user-plus"></i>

Create Account

</button>

</form>

{% if error %}

<p class="error">

{{ error }}

</p>

{% endif %}

{% if success %}

<p class="success">

{{ success }}

</p>

{% endif %}

<p>

Already have an account?

<a href="/login">

Login

</a>

</p>

</div>

<script>

function togglePassword(){

    var password=document.getElementById("password");

    var eye=document.getElementById("eye");

    if(password.type==="password"){

        password.type="text";

        eye.classList.remove("fa-eye");

        eye.classList.add("fa-eye-slash");

    }

    else{

        password.type="password";

        eye.classList.remove("fa-eye-slash");

        eye.classList.add("fa-eye");

    }

}

</script>

</body>

</html>
